name: CI

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      RAILS_APP_ENV: sandbox
    name: test (ruby ${{ matrix.ruby }}, ${{ matrix.rails }})
    continue-on-error: ${{ matrix.rails == 'edge' }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.4'
          - '4.0'
        rails:
          - r8
          - r81
          - edge
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          # Edge tracks a moving branch, so its lockfile is not committed and
          # the resolved bundle must not be restored from cache.
          bundler-cache: ${{ matrix.rails != 'edge' }}
          rubygems: latest
        env:
          BUNDLE_GEMFILE: gemfiles/${{ matrix.rails }}.gemfile

      - name: Install edge dependencies
        if: matrix.rails == 'edge'
        env:
          BUNDLE_GEMFILE: gemfiles/${{ matrix.rails }}.gemfile
        run: bundle install --jobs 4 --retry 3

      - name: Run tests
        env:
          RAILS_APP_ENV: sandbox
          BUNDLE_GEMFILE: gemfiles/${{ matrix.rails }}.gemfile
        run: bin/rails test
